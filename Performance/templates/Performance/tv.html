<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>{{ display.name }} · LeadPlus-360 TV</title>
<style>
:root{--bg:#070b13;--panel:#111827;--ink:#f8fafc;--muted:#94a3b8;--line:rgba(255,255,255,.09);--accent:#7c5cff;--red:#ff5b6e;--yellow:#f4bd4f;--green:#24c58a}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(circle at 15% 0,#18234a 0,#070b13 52%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
header{height:92px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;border-bottom:1px solid var(--line);background:rgba(7,11,19,.72);backdrop-filter:blur(16px)}header h1{margin:0;font-size:clamp(22px,2.1vw,34px);letter-spacing:-.03em}header small{color:var(--muted);font-size:clamp(13px,1.1vw,17px)}
.stage{position:relative;height:calc(100vh - 154px);padding:30px 4vw}.slide{position:absolute;inset:30px 4vw;opacity:0;transform:translateX(40px) scale(.985);transition:opacity .7s ease,transform .7s ease;pointer-events:none}.slide.show{opacity:1;transform:none}.performance{display:grid;grid-template-columns:minmax(280px,35%) 1fr;gap:28px;align-items:center}
.person{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.avatar{width:min(24vw,250px);height:min(24vw,250px);border-radius:50%;object-fit:cover;border:6px solid rgba(255,255,255,.14);box-shadow:0 25px 70px rgba(0,0,0,.35)}.initials{display:grid;place-items:center;background:linear-gradient(135deg,#6d4aff,#9b83ff);font-size:clamp(48px,6vw,86px);font-weight:900}.person h2{font-size:clamp(28px,3vw,48px);margin:22px 0 5px}.person p{margin:0;color:var(--muted);font-size:clamp(15px,1.3vw,21px)}.rank{margin-top:18px;padding:8px 16px;border:1px solid var(--line);border-radius:999px;color:#dbe4ff;background:rgba(255,255,255,.04)}
.panel{background:linear-gradient(145deg,rgba(17,24,39,.96),rgba(15,23,42,.82));border:1px solid var(--line);border-radius:30px;padding:clamp(26px,3vw,48px);box-shadow:0 25px 90px rgba(0,0,0,.25)}.scoreline{display:flex;align-items:end;justify-content:space-between;gap:20px}.score{font-size:clamp(62px,8vw,120px);font-weight:900;line-height:.9;letter-spacing:-.07em}.label{font-size:clamp(20px,2vw,30px);font-weight:800;margin-bottom:8px}.meta{color:var(--muted);font-size:clamp(14px,1.2vw,18px)}
.red .score,.red .label{color:var(--red)}.yellow .score,.yellow .label{color:var(--yellow)}.green .score,.green .label{color:var(--green)}
.segments{display:grid;grid-template-columns:repeat(10,1fr);gap:8px;margin:32px 0 10px}.seg{height:34px;border-radius:8px;background:#263044;position:relative;overflow:hidden}.seg.filled.red{background:var(--red)}.seg.filled.yellow{background:var(--yellow)}.seg.filled.green{background:var(--green)}.seg span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;color:rgba(255,255,255,.75)}.seg-labels{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.numbers{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:24px}.stat{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid var(--line)}.stat b{display:block;font-size:20px;margin-top:3px}.stat small{color:var(--muted)}
.kpis{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.k{display:grid;grid-template-columns:minmax(120px,.8fr) 1fr 58px;gap:12px;align-items:center;font-size:14px}.bar{height:9px;background:#263044;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.celebrate,.poster{height:100%;display:grid;place-items:center;text-align:center}.celebrate .card{width:min(900px,90vw);padding:45px;border:1px solid var(--line);border-radius:36px;background:rgba(17,24,39,.88);box-shadow:0 30px 100px rgba(0,0,0,.35)}.celebrate .avatar{width:190px;height:190px;margin-bottom:20px}.occasion{font-size:clamp(20px,2vw,30px);font-weight:800;color:#f4bd4f;text-transform:uppercase;letter-spacing:.12em}.celebrate h2{font-size:clamp(38px,5vw,72px);margin:14px 0}.message{font-size:clamp(20px,2vw,30px);color:#dbe4ff}.poster img{max-width:94%;max-height:88%;object-fit:contain;border-radius:22px;box-shadow:0 25px 100px rgba(0,0,0,.45)}.poster .poster-copy{position:absolute;left:7%;bottom:9%;text-align:left;text-shadow:0 3px 20px #000}.poster h2{font-size:clamp(32px,4vw,68px);margin:0}.poster p{font-size:clamp(16px,1.6vw,26px)}
footer{position:fixed;left:0;right:0;bottom:0;height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 4vw;color:var(--muted);border-top:1px solid var(--line);background:rgba(7,11,19,.75)}.dots{display:flex;gap:7px;max-width:45vw;overflow:hidden}.dots i{width:8px;height:8px;flex:0 0 auto;border-radius:50%;background:#2c374e}.dots i.on{background:var(--accent);box-shadow:0 0 14px var(--accent)}
@media(max-width:900px){.performance{grid-template-columns:1fr}.person{height:auto}.avatar{width:130px;height:130px}.person h2{margin:8px 0 3px}.panel{padding:20px}.kpis{display:none}.numbers{grid-template-columns:repeat(3,1fr)}.segments{gap:4px}.seg{height:25px}.stage{padding-top:18px}.slide{inset:18px 4vw}}
</style></head><body>
<header><h1 id="title">{{ display.name }}</h1><small id="month"></small></header>
<div class="stage" id="stage"><div class="empty">Loading TV playlist…</div></div>
<footer><div class="dots" id="dots"></div><span id="stamp"></span></footer>
<script>
(function(){
var url="{% url 'tv_data' token %}",stage=document.getElementById('stage'),dots=document.getElementById('dots'),slides=[],idx=0,timer=null,baseSeconds=12;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e}
function avatar(p,cls){if(p.photo){var i=document.createElement('img');i.className=cls||'avatar';i.src=p.photo;i.alt=p.name;return i}return el('div',(cls||'avatar')+' initials',p.initials||'—')}
function performance(p){var s=el('section','slide performance '+p.colour),person=el('div','person');person.appendChild(avatar(p));person.appendChild(el('h2',null,p.name));person.appendChild(el('p',null,[p.designation,p.department].filter(Boolean).join(' · ')));person.appendChild(el('div','rank',p.rank?'Rank #'+p.rank:'Performance'));var panel=el('div','panel'),line=el('div','scoreline');line.appendChild(el('div','score',p.score===null?'—':p.score+'%'));line.appendChild(el('div','label',p.rating));panel.appendChild(line);var meta=el('div','meta',p.slab?'Slab '+p.slab+' / 10':'Performance summary');panel.appendChild(meta);var segs=el('div','segments');(p.segments||[]).forEach(function(x){var q=el('div','seg '+(x.filled?'filled ':'')+(x.colour||''));q.appendChild(el('span',String(x.n)));segs.appendChild(q)});panel.appendChild(segs);var labels=el('div','seg-labels');labels.appendChild(el('span','', 'Below target'));labels.appendChild(el('span','', 'Target'));panel.appendChild(labels);var nums=el('div','numbers');[['Target',p.target],['Achieved',p.revenue],['Status',p.rating]].forEach(function(a){var st=el('div','stat');st.appendChild(el('small',null,a[0]));st.appendChild(el('b',null,a[1]===null||a[1]===undefined?'—':(typeof a[1]==='number'&&a[0]!=='Status'?'₹'+a[1].toLocaleString('en-IN'):a[1])));nums.appendChild(st)});panel.appendChild(nums);s.appendChild(person);s.appendChild(panel);return s}
function celebration(p){var s=el('section','slide celebrate'),card=el('div','card');card.appendChild(avatar(p,'avatar'));card.appendChild(el('div','occasion',p.type==='birthday'?'Happy Birthday':'Happy Work Anniversary'));card.appendChild(el('h2',null,p.name));card.appendChild(el('div','message',p.message));if(p.designation)card.appendChild(el('p','meta',[p.designation,p.department].filter(Boolean).join(' · ')));s.appendChild(card);return s}
function poster(p){var s=el('section','slide poster');if(p.image){var i=document.createElement('img');i.src=p.image;i.alt=p.title;s.appendChild(i)}var copy=el('div','poster-copy');copy.appendChild(el('h2',null,p.title));if(p.subtitle)copy.appendChild(el('p',null,p.subtitle));s.appendChild(copy);return s}
function render(){stage.textContent='';dots.textContent='';if(!slides.length){stage.appendChild(el('div','empty','No TV content available.'));return}slides.forEach(function(p,i){stage.appendChild(p.type==='performance'?performance(p):p.type==='poster'?poster(p):celebration(p));dots.appendChild(el('i',i===0?'on':''))});show(Math.min(idx,slides.length-1));}
function show(i){idx=i;stage.querySelectorAll('.slide').forEach(function(s,n){s.classList.toggle('show',n===i)});dots.querySelectorAll('i').forEach(function(d,n){d.classList.toggle('on',n===i)});}
function start(){clearInterval(timer);var sec=(slides[idx]&&slides[idx].type==='poster'&&slides[idx].seconds)||baseSeconds;timer=setInterval(function(){if(!slides.length)return;show((idx+1)%slides.length);clearInterval(timer);start()},sec*1000)}
function load(){fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw Error(r.status);return r.json()}).then(function(d){document.getElementById('title').textContent=d.title;document.getElementById('month').textContent=d.month;document.getElementById('stamp').textContent='Live · Updated '+d.generated;var changed=JSON.stringify(d.slides)!==JSON.stringify(slides);slides=d.slides||[];baseSeconds=d.seconds||12;if(changed)render();start()}).catch(function(){document.getElementById('stamp').textContent='Connection lost · retrying…'})}load();setInterval(load,60000)
})();
</script></body></html>
