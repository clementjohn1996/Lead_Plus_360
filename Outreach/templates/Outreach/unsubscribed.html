<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Unsubscribe</title>
<style>body{font-family:system-ui,sans-serif;background:#f6f7fb;display:grid;place-items:center;min-height:100vh;margin:0}.box{background:#fff;padding:36px;border-radius:16px;max-width:420px;text-align:center;box-shadow:0 8px 30px rgba(10,16,32,.08)}button{background:#6c4dff;color:#fff;border:0;padding:12px 22px;border-radius:10px;font-size:15px;cursor:pointer}</style></head><body><div class="box">
{% if done %}<h2>You're unsubscribed</h2><p>You won't receive any more emails from us.</p>{% else %}<h2>Unsubscribe</h2><p>Stop all emails to <strong>{{ p.email }}</strong>?</p><form method="post">{% csrf_token %}<button>Yes, unsubscribe me</button></form>{% endif %}</div></body></html>
