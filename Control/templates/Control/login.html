{% load static %}<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · LeadPlus-360</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>:root{--p:#6d4aff;--ink:#0d1220}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6fb;color:var(--ink);font-family:"DM Sans",sans-serif}.login{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #e7eaf0;border-radius:20px;padding:32px;box-shadow:0 20px 60px rgba(20,27,55,.1)}.brand{display:flex;align-items:center;gap:10px;font:800 20px Manrope;margin-bottom:30px}.mark{width:35px;height:35px;border-radius:11px;background:linear-gradient(135deg,#6d4aff,#9b83ff);color:#fff;display:grid;place-items:center}.brand span:last-child{color:#7455ef}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#8b94a7;font-weight:800}.login h1{font:800 26px Manrope;margin:6px 0}.sub{color:#7b8496;font-size:12px;margin:0 0 24px}.field{margin-bottom:14px}.field label{display:block;font-size:11px;font-weight:700;color:#586276;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #dfe3eb;border-radius:10px;font:inherit;outline:0}.field input:focus{border-color:#9b88f3;box-shadow:0 0 0 3px #eeeaff}.btn{width:100%;border:0;padding:12px;border-radius:10px;background:var(--p);color:#fff;font-weight:700;cursor:pointer}.error{background:#fff0f2;color:#bd3d53;padding:10px;border-radius:9px;font-size:11px;margin-bottom:14px}</style></head><body><div class="login"><div class="brand"><span class="mark">L</span><span style="color:#fff;background:#0d1220;padding:5px 8px;border-radius:7px">LeadPlus<span>-360</span></span></div><span class="eyebrow">TEAM PERFORMANCE HUB</span><h1>Welcome back</h1><p class="sub">Sign in to access CRM, attendance and performance.</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form method="post">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}"><div class="field"><label>Username or email</label><input name="username" value="{{ identifier }}" autocomplete="username" placeholder="Username or email" required></div><div class="field"><label>Password</label><input type="password" name="password" autocomplete="current-password" required></div><button class="btn">Sign in</button></form></div></body></html>
